[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twic-archive-manager"
version = "0.1.0"
description = "Windows-local TWIC archive manager"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.8",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "nuitka",
]

[project.scripts]
twic-archive-manager = "app.launcher:main"

[tool.setuptools.packages.find]
include = ["app", "app.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
