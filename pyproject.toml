[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twic-archive-manager"
version = "0.1.0"
description = "Windows-local TWIC archive manager"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
  "httpx",
  "pytest",
  "pyinstaller",
]

[project.scripts]
twic-archive-manager = "app.launcher:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
